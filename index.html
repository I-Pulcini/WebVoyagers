<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVoyagers</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
            line-height: 1.6;
           /*sfondo*/
            background-image: url('web.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
        }

        /* Stile per il titolo in alto sul cielo */
        .main-title {
            text-align: center;
            color: white;
            font-size: 3.5em; /* Molto più grande */
            margin-top: 20px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.6); /* Aiuta la leggibilità */
        }

        /* Contenitore generale del menu in alto a destra */
        .menu-container {
            position: absolute; 
            top: 15px;
            right: 20px;
            display: inline-block;
            z-index: 1000;
        }

        /* Stile delle tre linette (Hamburger) */
        .hamburger {
            font-size: 35px;
            cursor: pointer;
            user-select: none;
            color: #333;
        }

        /* Stile del menu a comparsa */
        .menu-dropdown {
            display: none; 
            position: absolute;
            right: 0;
            background-color: #ffffff;
            min-width: 200px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        /* Classe attivata da JS per mostrare il menu */
        .menu-dropdown.show {
            display: block;
        }

        .menu-dropdown a {
            color: #333;
            padding: 14px 20px;
            text-decoration: none;
            display: block;
            font-size: 16px;
            border-bottom: 1px solid #eee;
        }

        .menu-dropdown a:last-child {
            border-bottom: none;
        }

        .menu-dropdown a:hover {
            background-color: #f1f1f1;
            color: #007bff;
        }

        /* Layout dei contenuti principali */
        .main-content {
            margin-top: 20vh; /* Casella abbassata rispetto a prima */
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            background: rgba(100, 100, 100, 0.4); /* Grigio quasi trasparente */
            backdrop-filter: blur(5px); /* Leggera sfocatura per far leggere meglio il testo */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* Scritte spostate in basso a sinistra */
        .intro-text {
            position: fixed; /* Fissa il testo rispetto alla finestra */
            bottom: 20px;    /* In basso */
            left: 20px;      /* A sinistra */
            font-size: 1.1em;
            color: #ffffff;  /* Testo bianco */
            text-align: left;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8); /* Ombra scura per leggere bene sullo sfondo */
            z-index: 10;
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* L'ultimo form-group non ha bisogno di margine sotto */
        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff; /* Testo bianco */
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box; /* Importante per non far uscire i bordi */
        }
    </style>
</head>
