<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVoyagers</title>
    <style>  /* da qui inizia il codice CSS che decide l'aspetto visivo del sito web*/
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
            line-height: 1.6;
           /*sfondo*/
            background-image: url('web.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
        }

        /* Stile per il titolo in alto sul cielo con contorno stile foto */
        .main-title {  /*server per il titolo, centra il testo,lo colora di bianco */
            text-align: center;
            color: white;
            font-size: 3.5em; /*rende il testo più grande */
            margin-top: 20px; /*gestisce la distanza da cio che sta sopra e sotto*/
            margin-bottom: 0px;  /*gestisce la distanza da cio che sta sopra e sotto*/
            font-weight: 900; 
            -webkit-text-stroke: 3px black; /*crea il bordo nero intorno a quello bianco del testo*/
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5); 
        }

        /* Contenitore generale del menu in alto a destra */
        .menu-container {
            position: absolute; 
            top: 15px;
            right: 20px;
            display: inline-block;
            z-index: 1000;
        }

        /* Stile delle tre linette (Hamburger) */
        .hamburger {  
            font-size: 35px;
            cursor: pointer;  /* fa comparire la manina quando ci passi sopra*/
            user-select: none;
            color: #ffffff; /* Fatte bianche come richiesto */
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8); /* Ombra per renderle visibili sul cielo chiaro */
        }

        /* Stile del menu a comparsa */
        .menu-dropdown { 
            display: none; 
            position: absolute;
            right: 0;
            background-color: #ffffff;
            min-width: 200px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2); /*sfondo bianco e un'ombra e bordi arrotondati*/
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        /* Classe attivata da JS per mostrare il menu */
        .menu-dropdown.show {  /*quando javaScript aggiunge la parola show all'HTML del menu questo passa da invisibil e a visibile (block)*/
            display: block;
        }

        .menu-dropdown a {  /* definisce l'aspetto di link dentro al menu*/
            color: #333;
            padding: 14px 20px;
            text-decoration: none;
            display: block;
            font-size: 16px;
            border-bottom: 1px solid #eee;
        }

        /* Stile specifico per le voci del sottomenu */
        .submenu-content {  /* è il sottomenu che si trova cliccando Esplora  he inizialmente è invisibile ma se lo clicchi no*/
            display: none; /* Nascosto di default */
            background-color: #f8f9fa; /* Sfondo leggermente più scuro per differenziarlo */
        }

        .submenu-content.show {
            display: block; /*menu visibile */
        }

        .submenu-content a {  /*i link dentro menu*/
            padding: 12px 20px 12px 40px; /* Più rientrato a destra per far capire che è un sottomenu */
            font-size: 15px;
            border-bottom: 1px solid #e9e9e9;
        }

        .menu-dropdown a:last-child {
            border-bottom: none;  /* dice al browser di non mettere la riga del mouse quadno passi sul menu*/
        }

        .menu-dropdown a:hover {
            background-color: #f1f1f1;
            color: #007bff;
        }

        /* Layout dei contenuti principali */
        .main-content {
            margin-top: 35vh; 
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            background: rgba(100, 100, 100, 0.4); 
            backdrop-filter: blur(5px); 
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff; 
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box; 
        }
    </style>
</head>
<body>

    <div class="menu-container"> <div class="hamburger" onclick="toggleMenu()">&#9776;</div> <div id="myDropdown" class="menu-dropdown">
            
            <a href="#" onclick="toggleSubmenu(event)">Esplora &#9662;</a>
            <div id="esploraSubmenu" class="submenu-content">
                <a href="#">In Programma</a>
                <a href="#">In Arrivo</a>
                <a href="#">Last Minute</a>
            </div>

            <a href="#">Chi Siamo</a>
            <a href="#">F.A.Q.</a>
            <a href="#">Contattaci</a>
        </div>
    </div>

    <h1 class="main-title">WebVoyagers</h1>

    <div class="main-content"> <div class="form-group">
            <label for="parla"> Quando? :</label> 
          <select id="parla" name="parla" required>
                <option value="" disabled selected>Scegli un periodo</option>
                <option value="Gennaio">Gennaio</option>
                <option value="Febbraio">Febbraio</option>
                <option value="Marzo">Marzo</option>
                <option value="Aprile">Aprile</option>
                <option value="Maggio">Maggio</option>
                <option value="Giugno">Giugno</option>
                <option value="Luglio">Luglio</option>
                <option value="Agosto">Agosto</option>
                <option value="Settembre">Settembre</option>
                <option value="Ottobre">Ottobre</option>
                <option value="Novembre">Novembre</option>
                <option value="Dicembre">Dicembre</option>
          </select>
        </div>

        <div class="form-group"> <label for="paese">Scegli un paese:</label>
            <select id="paese" name="paese" required>
                <option value="" disabled selected>Scegli una destinazione...</option>
                <option value="Italia">Italia</option>
                <option value="Spagna">Spagna</option>
                <option value="Francia">Francia</option>
                </select>
        </div> <div class="form-group"> <button id="bottoneCerca" style="width: 100%; padding: 12px; margin-top: 15px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer;">
                Cerca Destinazione
            </button>
        </div>
    </div>


    <script>
        // Funzione per aprire/chiudere il menu principale
        function toggleMenu() {
            document.getElementById("myDropdown").classList.toggle("show");
        }

        // Funzione per aprire/chiudere il sottomenu "Esplora"
        function toggleSubmenu(event) {
            event.preventDefault(); // Evita che la pagina scatti verso l'alto
            event.stopPropagation(); // Evita che il click chiuda il menu genitore
            document.getElementById("esploraSubmenu").classList.toggle("show");
        }

        // Chiude i menu se l'utente clicca fuori.
        window.onclick = function(event) {
            // Controlla se il click NON è sull'hamburger e NON è all'interno del sottomenu
            if (!event.target.matches('.hamburger') && !event.target.closest('.menu-dropdown')) {
                var dropdowns = document.getElementsByClassName("menu-dropdown");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                        
                        // Chiudi anche il sottomenu quando si clicca fuori
                        var submenus = document.getElementsByClassName("submenu-content");
                        for(var j = 0; j < submenus.length; j++) {
                            submenus[j].classList.remove('show');
                        }
                    }
                }
            }
        }
        
        // Funzione per il bottone di ricerca
        document.getElementById("bottoneCerca").addEventListener("click", function() {
            var mese = document.getElementById("parla").value;
            var paese = document.getElementById("paese").value;

            // Controlla se l'utente ha scelto entrambe le opzioni
            if (mese !== "" && paese !== "") {
                // Trasforma in minuscolo e sostituisce gli spazi con l'underscore "_"
                var nomeMese = mese.toLowerCase();
                var nomePaese = paese.toLowerCase().replace(/ /g, "_");
                
                // Crea il nome esatto del file da cercare
                var nomePagina = nomeMese + "_" + nomePaese + ".html";
                
                // Usa il comando "fetch" per controllare se il file esiste
                fetch(nomePagina, { method: 'HEAD' })
                    .then(function(response) {
                        if (response.ok) {
                            // Il file esiste! Mandiamo l'utente alla pagina del viaggio
                            window.location.href = nomePagina;
                        } else {
                            // Il file non esiste (Errore 404). Lo mandiamo alla pagina "non disponibile"
                            window.location.href = "non_disponibile.html";
                        }
                    })
                    .catch(function(error) {
                        // Se c'è un problema di rete, per sicurezza mandalo alla pagina non disponibile
                        window.location.href = "non_disponibile.html";
                    });
                    
            } else {
                alert("Per favore, seleziona sia il mese che la destinazione.");
            }
        });
    </script>

</body>
</html>
