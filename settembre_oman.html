<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per Te</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh; /* Occupa tutta l'altezza dello schermo */
            display: flex;
            justify-content: center;
            align-items: center;
            /* INSERISCI QUI IL NOME DELLA TUA FOTO */
            background-image: url('sfondo_amore.jpg'); 
            background-size: cover;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Evita le barre di scorrimento */
        }

        /* Velo scuro per far leggere perfettamente le scritte sopra la foto */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Scurisce la foto al 50% */
            z-index: 1;
        }

        /* Contenitore del testo per tenerlo centrato e in primo piano */
        .contenuto {
            position: relative;
            z-index: 2; /* Lo tiene sopra al velo scuro */
            text-align: center;
            padding: 40px;
            max-width: 800px;
        }

        /* Stile del titolo grande e rosso */
        h1 {
            color: #ff3333; /* Un rosso acceso e romantico */
            font-size: 6em;
            margin-bottom: 20px;
            margin-top: 0;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.8); /* Ombra scura per farlo risaltare al massimo */
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* Stile del messaggio di scuse */
        .messaggio {
            color: white;
            font-size: 2em;
            line-height: 1.5;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            font-weight: 500;
        }

        /* Stile della firma */
        .firma {
            color: white;
            font-size: 1.8em;
            font-style: italic; /* Testo in corsivo */
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            text-align: right; /* Sposta la firma un po' più a destra */
            padding-right: 40px;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="contenuto">
        <h1>TI AMO BIMBA</h1>
        <p class="messaggio">scusa se oggi ti ho fatto stare male e ti ho fatto pensare di non soddisfarmi abbastanza, ti amo tantissimo bimba sei perfetta</p>
        <p class="firma">dal tuo pulci</p>
    </div>

</body>
</html>
