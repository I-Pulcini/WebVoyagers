<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVoyagers</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
            line-height: 1.6;
           /*sfondo*/
            background-image: url('web.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
        }

        /* Contenitore generale del menu in alto a destra */
        .menu-container {
            position: absolute; 
            top: 15px;
            right: 20px;
            display: inline-block;
            z-index: 1000;
        }

        /* Stile delle tre linette (Hamburger) */
        .hamburger {
            font-size: 35px;
            cursor: pointer;
            user-select: none;
            color: #333;
        }

        /* Stile del menu a comparsa */
        .menu-dropdown {
            display: none; 
            position: absolute;
            right: 0;
            background-color: #ffffff;
            min-width: 200px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        /* Classe attivata da JS per mostrare il menu */
        .menu-dropdown.show {
            display: block;
        }

        .menu-dropdown a {
            color: #333;
            padding: 14px 20px;
            text-decoration: none;
            display: block;
            font-size: 16px;
            border-bottom: 1px solid #eee;
        }

        .menu-dropdown a:last-child {
            border-bottom: none;
        }

        .menu-dropdown a:hover {
            background-color: #f1f1f1;
            color: #007bff;
        }

        /* Layout dei contenuti principali unificato e corretto */
        .main-content {
            margin-top: 15vh; /* <--- Casella abbassata e più centrale */
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            background: rgba(100, 100, 100, 0.4); /* <--- Grigio semitrasparente */
            backdrop-filter: blur(5px); /* <--- Sfocatura sfondo */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .intro-text {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box; /* Importante per non far uscire i bordi */
        }

        /* Stile per il titolo unificato con effetto contorno come in foto */
        h2 {
            text-align: center;
            color: white; /* <--- Testo bianco */
            /* <--- Contorno nero spesso multi-direzionale tramite ombre di testo */
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
            font-size: 2.5em; /* <--- Un po' più grande per l'impatto */
        }
    </style>
</head>
