<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebVoyagers</title>
    
    <link rel="stylesheet" href="style.css">
    
    <script src="script.js" defer></script>
</head>
<body class="home-body"> 

    <nav class="menu-container"> 
        <div class="hamburger" id="hamburgerBtn">&#9776;</div> 
        
        <div id="myDropdown" class="menu-dropdown">
            <a href="#" id="esploraBtn">Esplora &#9662;</a>
            <div id="esploraSubmenu" class="submenu-content">
                <a href="#">Viaggi disponibili</a>
                <a href="#">Viaggi sold out</a>
                <a href="#">Viaggi in arrivo</a>
                <a href="#">Viaggio fai da te</a>
            </div>
            <a href="#">Chi Siamo</a>
            <a href="#">F.A.Q.</a>
            <a href="#">Contattaci</a>
        </div>
    </nav>

    <header>
        <h1 class="main-title">WebVoyagers</h1>
    </header>

    <main class="main-content"> 
        
        <form id="ricercaViaggio">
            
            <div class="form-group">
                <label for="parla">Quando? :</label> 
                
                <select id="parla" name="parla" required>
                    <option value="" disabled selected>Caricamento mesi...</option>
                </select>
            </div>

            <div class="form-group"> 
                <label for="paese">Scegli un paese:</label>
                
                <select id="paese" name="paese" required>
                    <option value="" disabled selected>Caricamento destinazioni...</option>
                </select>
            </div>
            
            <div class="form-group"> 
                <button type="submit" id="bottoneCerca">Cerca Destinazione</button>
            </div>
            
        </form>
    </main>

</body>
</html>
